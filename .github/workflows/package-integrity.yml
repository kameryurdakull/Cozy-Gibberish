name: Package Integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate package manifest
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='com.kamer.cozygibberish') throw new Error('Unexpected package name'); if(!p.version) throw new Error('Missing version');"

      - name: Verify distributable contents
        run: npm pack --dry-run
